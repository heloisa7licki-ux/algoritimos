<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Interativo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #273549;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --ok-bg: rgba(34, 197, 94, 0.16);
      --ok-border: #22c55e;
      --err-bg: rgba(239, 68, 68, 0.16);
      --err-border: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .quiz-container {
      width: 100%;
      max-width: 580px;
      background: var(--card);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    h1 {
      font-size: 1.35rem;
      line-height: 1.35;
      margin-bottom: 12px;
    }

    p.subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
      margin-bottom: 18px;
    }

    .user-form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .user-input {
      flex: 1;
      min-width: 200px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(15, 23, 42, 0.7);
      color: var(--text);
      font-size: 1rem;
    }

    .user-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      color: #082f49;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 0.96rem;
      cursor: pointer;
      transition: background 0.18s ease;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-weight: 600;
    }

    .btn-secondary:hover {
      background: var(--card-hover);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .user-pill {
      color: var(--text);
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .question {
      font-size: 1.22rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(15, 23, 42, 0.55);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .option-btn:hover:not(:disabled) {
      background: var(--card-hover);
      border-color: var(--accent);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background: var(--ok-bg);
      border-color: var(--ok-border);
    }

    .option-btn.wrong {
      background: var(--err-bg);
      border-color: var(--err-border);
    }

    .feedback {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.96rem;
      line-height: 1.45;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.ok {
      background: var(--ok-bg);
      border: 1px solid var(--ok-border);
      color: #dcfce7;
    }

    .feedback.err {
      background: var(--err-bg);
      border: 1px solid var(--err-border);
      color: #fee2e2;
    }

    .footer-actions {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hidden {
      display: none !important;
    }

    .result-box {
      text-align: center;
    }

    .result-box h2 {
      font-size: 1.55rem;
      margin-bottom: 12px;
    }

    .score-highlight {
      font-size: 1.2rem;
      color: var(--text);
      font-weight: 700;
      margin-bottom: 22px;
    }

    .result-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <main class="quiz-container">
    <!-- Tela 1: Nome do usuário -->
    <section id="login-screen">
      <h1>Entrar no Quiz</h1>
      <p class="subtitle">
        Digite seu nome para começar a rodada.
      </p>

      <form class="user-form" id="user-form">
        <input
          class="user-input"
          id="username-input"
          type="text"
          maxlength="30"
          placeholder="Seu nome"
          required
        />
        <button class="btn" type="submit">Começar</button>
      </form>
    </section>

    <!-- Tela 2: Perguntas -->
    <section id="quiz-screen" class="hidden">
      <div class="top-bar">
        <span class="user-pill" id="active-user-badge">Usuário: -</span>
        <span id="progress">Questão 1 de 2</span>
        <span id="score">Acertos: 0</span>
      </div>

      <h1 class="question" id="question-text">Carregando...</h1>
      <div class="options" id="options-list"></div>

      <div class="feedback" id="feedback-box"></div>

      <div class="footer-actions">
        <button class="btn btn-secondary" id="switch-user-btn" type="button">Trocar usuário</button>
        <button class="btn hidden" id="next-btn" type="button">Próxima pergunta</button>
      </div>
    </section>

    <!-- Tela 3: Apenas a pontuação da rodada -->
    <section id="result-screen" class="result-box hidden">
      <h2>Fim da rodada!</h2>
      <p class="score-highlight" id="round-score"></p>

      <div class="result-actions">
        <button class="btn" id="restart-btn" type="button">Jogar novamente</button>
        <button class="btn btn-secondary" id="result-switch-user-btn" type="button">Trocar usuário</button>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: "Qual estrutura de dados segue a regra LIFO (último a entrar, primeiro a sair)?",
        options: [
          "Fila (Queue)",
          "Pilha (Stack)",
          "Árvore binária",
          "Tabela hash"
        ],
        correctIndex: 1,
        explanation: "A pilha (Stack) funciona como uma pilha de pratos: o último item colocado é o primeiro a sair."
      },
      {
        question: "No protocolo HTTP, qual código de status indica que a requisição foi bem-sucedida?",
        options: [
          "200 OK",
          "301 Moved Permanently",
          "404 Not Found",
          "500 Internal Server Error"
        ],
        correctIndex: 0,
        explanation: "O status 200 OK indica que o servidor processou a solicitação com sucesso."
      }
    ];

    let currentUser = "";
    let currentIndex = 0;
    let score = 0;

    const loginScreen = document.getElementById("login-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");

    const userForm = document.getElementById("user-form");
    const usernameInput = document.getElementById("username-input");

    const activeUserBadge = document.getElementById("active-user-badge");
    const progressEl = document.getElementById("progress");
    const scoreEl = document.getElementById("score");
    const questionEl = document.getElementById("question-text");
    const optionsEl = document.getElementById("options-list");
    const feedbackEl = document.getElementById("feedback-box");
    const nextBtn = document.getElementById("next-btn");
    const switchUserBtn = document.getElementById("switch-user-btn");

    const roundScoreEl = document.getElementById("round-score");
    const restartBtn = document.getElementById("restart-btn");
    const resultSwitchUserBtn = document.getElementById("result-switch-user-btn");

    function startQuizForUser(rawName) {
      const cleanName = rawName.trim();
      if (!cleanName) return;

      currentUser = cleanName;
      currentIndex = 0;
      score = 0;

      activeUserBadge.textContent = `Usuário: ${currentUser}`;
      loginScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");

      renderQuestion();
    }

    function renderQuestion() {
      const current = questions[currentIndex];
      progressEl.textContent = `Questão ${currentIndex + 1} de ${questions.length}`;
      scoreEl.textContent = `Acertos: ${score}`;
      questionEl.textContent = current.question;
      optionsEl.innerHTML = "";

      feedbackEl.className = "feedback";
      feedbackEl.textContent = "";
      nextBtn.classList.add("hidden");
      nextBtn.textContent =
        currentIndex === questions.length - 1 ? "Ver pontuação" : "Próxima pergunta";

      current.options.forEach((optionText, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.textContent = optionText;
        btn.addEventListener("click", () => selectOption(idx, btn));
        optionsEl.appendChild(btn);
      });
    }

    function selectOption(selectedIdx, clickedBtn) {
      const current = questions[currentIndex];
      const allButtons = optionsEl.querySelectorAll(".option-btn");

      allButtons.forEach((btn) => {
        btn.disabled = true;
      });

      const isCorrect = selectedIdx === current.correctIndex;

      if (isCorrect) {
        score++;
        scoreEl.textContent = `Acertos: ${score}`;
        clickedBtn.classList.add("correct");
        feedbackEl.className = "feedback show ok";
        feedbackEl.textContent = `Você acertou! ${current.explanation}`;
      } else {
        clickedBtn.classList.add("wrong");
        allButtons[current.correctIndex].classList.add("correct");
        feedbackEl.className = "feedback show err";
        feedbackEl.textContent = `Você errou! A resposta correta era "${current.options[current.correctIndex]}". ${current.explanation}`;
      }

      nextBtn.classList.remove("hidden");
    }

    nextBtn.addEventListener("click", () => {
      currentIndex++;
      if (currentIndex < questions.length) {
        renderQuestion();
      } else {
        showRoundResult();
      }
    });

    function showRoundResult() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      roundScoreEl.textContent = `${currentUser}, sua pontuação nesta rodada foi ${score} de ${questions.length}.`;
    }

    function goToLogin() {
      usernameInput.value = "";
      quizScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      loginScreen.classList.remove("hidden");
    }

    userForm.addEventListener("submit", (event) => {
      event.preventDefault();
      startQuizForUser(usernameInput.value);
    });

    restartBtn.addEventListener("click", () => {
      startQuizForUser(currentUser);
    });

    switchUserBtn.addEventListener("click", goToLogin);
    resultSwitchUserBtn.addEventListener("click", goToLogin);
  </script>
</body>
</html>
